apiVersion: apps/v1
kind: Deployment
metadata:
  name: presentacion
  labels:
    app: presentacion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presentacion
  template:
    metadata:
      labels:
        app: presentacion
    spec:
      containers:
        - name: presentacion
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "48Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
        # Asistente de IA de la landing: misma imagen, otro proceso. Solo CONTESTA texto: sin base de datos, sin herramientas y sin
        # guardar conversaciones. Escucha en 127.0.0.1 (solo el nginx de este pod llega a él) y habla con el modelo del cluster.
        - name: chat
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          command: ["node", "/app/chat/server.mjs"]
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "127.0.0.1"
            # Mismo modelo local y sin costo que usa el asistente del CRM. Para Claude: LLM_PROVIDER=anthropic,
            # LLM_BASE_URL=https://api.anthropic.com, LLM_MODEL=<modelo> y la clave en el secreto presentacion-llm.
            - name: LLM_PROVIDER
              value: "openai-compat"
            - name: LLM_BASE_URL
              value: "http://ollama:11434/v1"
            - name: LLM_MODEL
              value: "gemma4:12b"
            # Un modelo local en frío puede tardar; el servicio manda latidos para que Cloudflare no corte la conexión.
            - name: LLM_TIMEOUT_MS
              value: "150000"
            - name: LLM_MAX_TOKENS
              value: "400"
            # Límites por visitante y simultáneos: el modelo es un recurso compartido con el asistente del CRM.
            - name: RATE_PER_MINUTE
              value: "6"
            - name: RATE_PER_DAY
              value: "60"
            - name: MAX_CONCURRENT
              value: "2"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: presentacion-llm, key: api-key, optional: true }
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              memory: "48Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # Escucha en 127.0.0.1, así que las sondas del kubelet (que llegan por la IP del pod) no sirven: se prueba desde dentro.
          readinessProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            initialDelaySeconds: 3
            periodSeconds: 15
