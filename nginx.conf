server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # /pos-kiosko -> /pos-kiosko/ como redirección RELATIVA: detrás del túnel de Cloudflare y de Traefik, la absoluta saldría con
  # el esquema y el puerto internos (http://www.noahsolution.com:80/...).
  absolute_redirect off;

  # El chat manda como mucho ~16 KB (el servicio también lo valida)
  client_max_body_size 16k;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # OJO: en nginx, un add_header dentro de un location ANULA los del servidor (no se suman). Por eso las cabeceras de
  # seguridad se repiten en cada location en vez de ponerse una vez arriba.

  # Astro versiona los archivos de /_astro con un hash en el nombre: se pueden cachear para siempre.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # El asistente: lo atiende el contenedor `chat` del mismo pod (127.0.0.1:3000). Respuesta por trozos: sin buffer, y con un
  # tiempo de espera largo porque un modelo local en frío puede tardar antes del primer trozo (el servicio manda latidos).
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 200s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # La página en sí se revalida siempre: así un despliegue nuevo se ve al recargar.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ =404;
  }
}
