server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # OJO: en nginx, un add_header dentro de un location ANULA los del servidor (no se suman). Por eso las cabeceras de
  # seguridad se repiten en cada location en vez de ponerse una vez arriba.

  # Astro versiona los archivos de /_astro con un hash en el nombre: se pueden cachear para siempre.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # La página en sí se revalida siempre: así un despliegue nuevo se ve al recargar.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ =404;
  }
}
